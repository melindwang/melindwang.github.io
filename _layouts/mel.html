<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/mel.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site-head.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  {% include theme-init.html %}
</head>
<body>
  {% include site-head.html %}

  <main class="{{ page.body_class }}">
    {{ content }}
  </main>

  <footer class="site-foot">
    {%- for entry in site.minima.social_links -%}
      <a href="{{ entry.user_url }}" target="_blank" rel="me noopener">{{ entry.title | default: entry.platform }}</a>
    {%- endfor -%}
  </footer>
</body>
</html>
